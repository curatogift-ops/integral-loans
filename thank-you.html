<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Thank You | Integral Loans</title>
<meta name="robots" content="noindex"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="thank-you-page">

<section class="thank-you-section">
  <div class="thank-you-card">
    <div class="thank-you-icon"><i class="fa fa-check-circle"></i></div>
    <h1>Thank You!</h1>
    <p class="thank-you-lead" id="thankYouMessage">Your inquiry has been submitted successfully.</p>
    <p class="thank-you-sub">Our loan expert will contact you within 24 hours.</p>
    <p class="thank-you-countdown">Redirecting to homepage in <strong id="countdown">5</strong> seconds…</p>
    <a href="index.html" class="btn btn-primary thank-you-btn"><i class="fa fa-home"></i> Go to Homepage Now</a>
  </div>
</section>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  const msg = document.getElementById('thankYouMessage');
  if (name && msg) {
    msg.textContent = `Thank you, ${name}! Your inquiry has been submitted successfully.`;
  }

  let seconds = 5;
  const countdownEl = document.getElementById('countdown');
  const timer = setInterval(() => {
    seconds -= 1;
    if (countdownEl) countdownEl.textContent = String(Math.max(seconds, 0));
    if (seconds <= 0) clearInterval(timer);
  }, 1000);

  setTimeout(() => {
    window.location.href = 'index.html';
  }, 5000);
})();
</script>
</body>
</html>
